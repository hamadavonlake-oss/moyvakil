version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: moyvakil-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: moyvakil
      POSTGRES_PASSWORD: password
      POSTGRES_DB: moyvakil
    volumes:
      - moyvakil-data:/var/lib/postgresql/data

volumes:
  moyvakil-data:
